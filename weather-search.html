<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Weather</title>
<style>
  :root{ --text:#37352f; --muted:#9b9a97; --line:#e9e9e7; --bg:#ffffff; --hover:#f1f1ef; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px}
  .wrap{max-width:320px;margin:0 auto;padding:12px 14px 16px;text-align:center}

  .search{position:relative;margin:0 auto 14px;max-width:240px}
  .search input{width:100%;padding:6px 26px 6px 4px;border:0;border-bottom:1px solid var(--line);
    background:transparent;color:var(--text);font:inherit;font-size:13px;text-align:center;outline:none}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-bottom-color:var(--text)}
  .search .go{position:absolute;right:0;top:50%;transform:translateY(-50%);border:0;background:none;
    color:var(--muted);cursor:pointer;padding:4px;line-height:0}
  .results{position:absolute;left:-20px;right:-20px;top:calc(100% + 4px);background:var(--bg);border:1px solid var(--line);
    border-radius:6px;box-shadow:0 6px 18px rgba(15,15,15,.1);z-index:10;overflow:hidden;display:none;text-align:left}
  .results button{display:block;width:100%;text-align:left;padding:8px 10px;border:0;background:none;
    color:var(--text);font:inherit;font-size:13px;cursor:pointer}
  .results button:hover,.results button.active{background:var(--hover)}
  .results small{color:var(--muted)}

  .place{font-weight:700;text-transform:uppercase;line-height:1.25}
  .label{font-weight:100;line-height:1.25}
  .big{margin:10px auto 6px;width:50px;height:50px}
  .temp{font-size:24px;font-weight:500;margin-top:14px}
  .desc{font-weight:500;margin-top:2px}
  .extra{font-size:12px;color:var(--muted);margin-top:8px}

  .days{margin:26px auto 0;max-width:200px}
  .day{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;gap:8px;margin-bottom:22px}
  .day .d{font-weight:500;letter-spacing:1px;text-align:center}
  .day svg{width:30px;height:30px;margin:0 auto;display:block}
  .day .hl{text-align:left;line-height:1.3}
  .day .hi{font-weight:600}
  .day .lo{font-weight:500}
  .msg{color:var(--muted);font-size:13px;padding:24px 4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="search">
    <input id="q" type="text" placeholder="Search a place…" autocomplete="off" aria-label="Search location">
    <button class="go" id="go" aria-label="Search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    </button>
    <div class="results" id="results"></div>
  </div>
  <div id="out"><div class="msg">Search for a place to see its forecast.</div></div>
</div>

<script>
const STATES={AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",DC:"District of Columbia"};

/* Simple flat icons: orange sun, blue cloud */
const SUN='#f7a823', CLOUD='#5aa0ea', LIGHT='#c9def7', DROP='#8fbdf0';
const sun=(cx,cy,r)=>{let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${SUN}"/>`;
  for(let i=0;i<8;i++){const a=i*Math.PI/4,x1=cx+Math.cos(a)*(r+3),y1=cy+Math.sin(a)*(r+3),x2=cx+Math.cos(a)*(r+7),y2=cy+Math.sin(a)*(r+7);
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${SUN}" stroke-width="2.4" stroke-linecap="round"/>`}
  return s};
const cloud=(dx,dy,c)=>`<path transform="translate(${dx} ${dy})" fill="${c}" d="M14 38h22a9 9 0 0 0 0-18 12 12 0 0 0-23-2A10 10 0 0 0 14 38z"/>`;
const drops=`<path d="M20 42l-2 6M28 42l-2 6M36 42l-2 6" stroke="${DROP}" stroke-width="2.4" stroke-linecap="round"/>`;
const bolt=`<path d="M27 40l-5 8h5l-3 7 8-10h-5l3-5z" fill="${SUN}"/>`;
const flakes=`<g fill="${DROP}"><circle cx="19" cy="46" r="2"/><circle cx="27" cy="49" r="2"/><circle cx="35" cy="46" r="2"/></g>`;
const fog=`<path d="M10 22h30M6 30h38M12 38h28" stroke="${LIGHT}" stroke-width="4" stroke-linecap="round"/>`;
function icon(c){
  let b;
  if(c===0) b=sun(25,25,10);
  else if(c===1||c===2) b=sun(18,16,8)+cloud(4,6,CLOUD);
  else if(c===3) b=cloud(-6,2,LIGHT)+cloud(2,6,CLOUD);
  else if(c===45||c===48) b=fog;
  else if(c>=95) b=cloud(0,-2,CLOUD)+bolt;
  else if((c>=71&&c<=77)||c===85||c===86) b=cloud(0,-2,CLOUD)+flakes;
  else if(c>=51) b=cloud(0,-2,CLOUD)+drops;
  else b=cloud(0,4,CLOUD);
  return `<svg viewBox="0 0 50 50" aria-hidden="true">${b}</svg>`;
}
const DESC={0:"clear sky",1:"mostly clear",2:"partly cloudy",3:"overcast",45:"fog",48:"freezing fog",51:"light drizzle",53:"drizzle",55:"heavy drizzle",
 56:"freezing drizzle",57:"freezing drizzle",61:"light rain",63:"rain",65:"heavy rain",66:"freezing rain",67:"freezing rain",71:"light snow",73:"snow",
 75:"heavy snow",77:"snow grains",80:"rain showers",81:"rain showers",82:"heavy showers",85:"snow showers",86:"snow showers",95:"thunderstorms",96:"storms with hail",99:"storms with hail"};

const $=id=>document.getElementById(id);
const q=$("q"), results=$("results"), out=$("out");
let matches=[], active=-1, timer=null;
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function label(p){const parts=[p.name]; if(p.admin1&&p.admin1!==p.name) parts.push(p.admin1); if(p.country_code!=="US") parts.push(p.country); return parts.join(", ")}

async function geocode(text){
  const [first,...rest]=text.split(",").map(s=>s.trim()).filter(Boolean);
  if(!first) return [];
  const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(first)}&count=20&language=en&format=json`)).json();
  let list=j.results||[];
  if(rest.length){
    const want=rest.join(" ").toLowerCase(), full=(STATES[rest[0].toUpperCase()]||"").toLowerCase();
    const f=list.filter(p=>{const a=(p.admin1||"").toLowerCase(),c=(p.country||"").toLowerCase(),cc=(p.country_code||"").toLowerCase();
      return (full&&a===full)||a.startsWith(want)||c.startsWith(want)||cc===want});
    if(f.length) list=f;
  }
  return list.slice(0,6);
}
function showResults(){
  if(!matches.length){results.style.display="none";return}
  results.innerHTML=matches.map((p,i)=>`<button data-i="${i}" class="${i===active?"active":""}">${label(p)}${p.population?` <small>· pop. ${p.population.toLocaleString()}</small>`:""}</button>`).join("");
  results.style.display="block";
}
async function search(pickFirst){
  const text=q.value.trim(); if(text.length<2){matches=[];showResults();return}
  try{ matches=await geocode(text); active=-1;
    if(pickFirst){ if(matches[0]) choose(matches[0]); else {out.innerHTML=`<div class="msg">No place found for “${text}”. Try just the city name.</div>`; matches=[]; showResults();} }
    else showResults();
  }catch(e){ out.innerHTML=`<div class="msg">Couldn't reach the location search. Try again.</div>` }
}
function choose(p){
  matches=[]; showResults(); q.value="";
  store("tripWeatherPlace",{name:p.name,admin1:p.admin1,country:p.country,country_code:p.country_code,latitude:p.latitude,longitude:p.longitude});
  forecast(p);
}
const time=iso=>new Date(iso).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});

async function forecast(p){
  out.innerHTML=`<div class="msg">Loading…</div>`;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${p.latitude}&longitude=${p.longitude}`+
    `&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise`+
    `&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=3`;
  try{
    const w=await (await fetch(url)).json(), c=w.current, d=w.daily;
    const days=d.time.map((t,i)=>`<div class="day">
        <div class="d">${new Date(t+"T12:00").toLocaleDateString("en-US",{weekday:"short"})}</div>
        ${icon(d.weather_code[i])}
        <div class="hl"><div class="hi">${Math.round(d.temperature_2m_max[i])} ºF</div><div class="lo">${Math.round(d.temperature_2m_min[i])} ºF</div></div>
      </div>`).join("");
    out.innerHTML=`
      <div class="place" title="${label(p)}">${p.name}</div>
      <div class="label">WEATHER</div>
      <div class="big">${icon(c.weather_code)}</div>
      <div class="temp">${Math.round(c.temperature_2m)} ºF</div>
      <div class="desc">${DESC[c.weather_code]||""}</div>
      <div class="extra">${p.admin1&&p.admin1!==p.name?p.admin1+" · ":""}sunrise ${time(d.sunrise[0])} · wind ${Math.round(c.wind_speed_10m)} mph</div>
      <div class="days">${days}</div>`;
  }catch(e){ out.innerHTML=`<div class="msg">Couldn't load the forecast. Try again in a moment.</div>` }
}

q.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>search(false),300)});
q.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"&&matches.length){active=(active+1)%matches.length;showResults();e.preventDefault()}
  else if(e.key==="ArrowUp"&&matches.length){active=(active-1+matches.length)%matches.length;showResults();e.preventDefault()}
  else if(e.key==="Enter"){e.preventDefault(); if(active>=0&&matches[active]) choose(matches[active]); else search(true)}
  else if(e.key==="Escape"){matches=[];showResults()}
});
$("go").addEventListener("click",()=>search(true));
results.addEventListener("click",e=>{const b=e.target.closest("button"); if(b) choose(matches[+b.dataset.i])});
document.addEventListener("click",e=>{if(!e.target.closest(".search")){matches=[];showResults()}});

const saved=load("tripWeatherPlace"), param=new URLSearchParams(location.search).get("q");
if(param){q.value=param;search(true)} else if(saved){forecast(saved)}
</script>
</body>
</html>
