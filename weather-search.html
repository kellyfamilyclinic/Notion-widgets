<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Weather</title>
<style>
  /* No background: the widget shows whatever Notion has behind it.
     Text colors follow the device's light/dark setting, the same way the Seguin widget does,
     and color-scheme matches Notion's so the browser doesn't paint a solid box behind the embed. */
  :root{color-scheme:light dark;
    --text:#37352f; --muted:#9b9a97; --faint:#b4b3af; --line:#e9e9e7; --rule:rgba(55,53,47,.09);
    --hover:rgba(55,53,47,.08); --focus:#c7c6c3; --pop:#fff; --onText:#fff}
  @media (prefers-color-scheme: dark){
    :root{--text:#fff; --muted:#9b9b9b; --faint:#7f7f7f; --line:#3a3a3a; --rule:rgba(255,255,255,.09);
      --hover:rgba(255,255,255,.08); --focus:#5a5a5a; --pop:#252525; --onText:#191919}
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:transparent;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif,"Apple Color Emoji","Segoe UI Emoji";
    font-size:16px;font-weight:400;line-height:1.55}
  body{display:flex;flex-direction:column}
  .content{flex:1 1 0%;min-height:0;width:100%;overflow-y:auto}
  .foot{height:26px;flex:0 0 26px}            /* same bottom space as the Seguin widget */
  /* recent places: sits below the weather area, which keeps the Seguin widget's size */
  .recent{flex:0 0 auto;border-top:1px solid var(--rule);padding:7px 10px 9px;text-align:center}
  .recent:empty{display:none}
  .recent .lbl{display:block;font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:500;margin-bottom:5px}
  .chip{display:inline-block;margin:2px 2px;padding:2px 9px;border:1px solid var(--line);border-radius:12px;background:transparent;
    font:inherit;font-size:12px;line-height:16px;color:var(--text);cursor:pointer;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis;vertical-align:top}
  .chip:hover{background:var(--hover)}
  .chip.on{background:var(--text);border-color:var(--text);color:var(--onText);cursor:default}
  .center{height:100%;display:flex;justify-content:center;flex:1 1 0%;padding:16px}
  /* Layout follows the same size rules as the Seguin widget.
     .v = vertical (block narrower than tall, or under 250px wide); otherwise horizontal.
     .min = compact text (vertical: block ≤395px tall or ≤260px wide; horizontal: ≤365px wide).
     .stack = current conditions above the days (horizontal and ≤670px wide). */
  .wx{display:flex;flex:1 1 0%;flex-direction:row;margin:auto 0}
  .wx.stack{flex-direction:column}
  .cur{display:flex;flex:1;flex-direction:row;justify-content:space-evenly;margin:0}
  .cur>.inner{display:flex;flex-direction:row;justify-content:space-evenly;margin:0;flex:1}
  .stack .cur{padding-bottom:15px}
  .v .cur{flex:3;flex-direction:column;justify-content:center;margin:20px 0 10px}
  .v .cur>.inner{flex-direction:column;justify-content:center;margin:20px 0 10px}
  .row{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 15px}
  .row.temps{margin:5px 0}
  .t{font-size:15px;line-height:1.2;font-weight:500;text-align:center;margin:0;white-space:nowrap}
  .min .t{font-size:12px}
  .t.light{font-weight:100;padding-top:1px}
  .t.big{font-size:1.5rem}
  .min .t.big{font-size:1.2rem}
  .t.hi{font-weight:600}
  .icon{width:50px;height:50px;display:block}
  .daily{display:flex;flex:1;flex-direction:column;margin:0}
  .v .daily{flex:8;margin-bottom:32px}
  .days{display:flex;flex-direction:row;flex:1 1 0%;justify-content:space-evenly}
  .v .days{flex-direction:column;padding:0 8px}
  .day{display:flex;flex-direction:column;justify-content:center;align-items:center;margin:0;padding:0 15px}
  .min .day{padding:0 5px}
  .v .day{flex-direction:row;margin:7px 0}
  .v.min .day{margin:3px 0}
  .day .name{letter-spacing:1px}
  .v .day .t:first-child{padding-left:3px}
  .day .iw{width:70px;height:50px;padding:0 10px}
  .deg{display:flex;flex-direction:column;margin:0 -15px}
  .deg>div{padding:0 15px}

  /* search: a faint magnifier in the top-right corner opens a bar over the widget,
     so the widget itself keeps the same size and layout as the Seguin one.
     Clicking the place name opens it too. */
  .place{cursor:pointer}
  .sbtn{position:fixed;top:6px;right:8px;z-index:20;width:24px;height:24px;border:0;border-radius:50%;
    background:transparent;color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .sbtn:hover{color:var(--text);background:var(--hover)}
  .sbar{position:fixed;top:6px;left:8px;right:8px;z-index:21;display:none}
  .sbar.open{display:block}
  .sbar input{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;outline:none;background:var(--pop);
    box-shadow:0 2px 8px rgba(15,15,15,.08);font:inherit;font-size:13px;color:var(--text);padding:0 30px 0 10px}
  .sbar input:focus{border-color:var(--focus)}
  .sbar input::placeholder{color:var(--faint)}
  .sbar .x{position:absolute;right:4px;top:3px;width:24px;height:24px;border:0;background:none;color:var(--muted);
    font-size:16px;line-height:24px;cursor:pointer;padding:0}
  .results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--pop);border:1px solid var(--line);
    border-radius:6px;box-shadow:0 6px 18px rgba(15,15,15,.1);z-index:10;overflow:hidden;display:none;text-align:left}
  .results button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:none;
    color:var(--text);font:inherit;font-size:13px;line-height:1.3;cursor:pointer}
  .results button:hover,.results button.active{background:var(--hover)}
  .results small{color:var(--muted)}
  .msg{font-size:13px;line-height:18px;color:var(--muted);text-align:center;padding-top:6px;white-space:normal}
</style>
</head>
<body>
<div class="content"><div class="center"><div class="wx" id="wx">
  <div class="cur"><div class="inner">
    <div class="row">
      <h4 class="t" id="nameSlot"></h4>
      <h4 class="t light">WEATHER</h4>
    </div>
    <div class="row" id="nowIcon" style="padding:0"></div>
    <div class="row temps">
      <h4 class="t big" id="nowTemp"></h4>
      <h4 class="t" id="nowDesc"></h4>
    </div>
  </div></div>
  <div class="daily"><div class="days" id="days"></div></div>
</div></div></div>
<div class="foot"></div>
<div class="recent" id="recent"></div>

<script>
/* ---------- icons (original artwork: flat sun / cloud with a soft shadow) ---------- */
const SUN="#f8a21d", CLOUD="#59a0ec", PALE="#c6dcf7", DROP="#7fb5ef";
function sunArt(cx,cy,r){let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${SUN}"/>`;
  for(let i=0;i<8;i++){const a=i*Math.PI/4,c=Math.cos(a),n=Math.sin(a);
    s+=`<line x1="${(cx+c*(r+2.2)).toFixed(1)}" y1="${(cy+n*(r+2.2)).toFixed(1)}" x2="${(cx+c*(r+4.6)).toFixed(1)}" y2="${(cy+n*(r+4.6)).toFixed(1)}" stroke="${SUN}" stroke-width="1.7" stroke-linecap="round"/>`}
  return s}
const moonArt=(cx,cy,r)=>`<path fill="${SUN}" d="M${cx+r*.25} ${cy-r} a${r} ${r} 0 1 0 ${r*.75} ${r*1.55} a${r*.8} ${r*.8} 0 0 1 -${r*.75} -${r*1.55}z"/>`;
const cloudArt=(x,y,s,c)=>`<path fill="${c}" transform="translate(${x} ${y}) scale(${s})" d="M7 22h17a6 6 0 0 0 .6-12A8 8 0 0 0 9.2 9.4 6.4 6.4 0 0 0 7 22z"/>`;
const rain=`<path d="M19 35.5l-1 3M25 35.5l-1 3M31 35.5l-1 3" stroke="${DROP}" stroke-width="1.5" stroke-linecap="round"/>`;
const snow=`<g fill="${DROP}"><circle cx="19" cy="37" r="1.3"/><circle cx="25" cy="38.5" r="1.3"/><circle cx="31" cy="37" r="1.3"/></g>`;
const bolt=`<path fill="${SUN}" d="M25.5 33.5l-3.2 5h2.8l-1.6 4.5 5-6h-2.8l2-3.5z"/>`;
const fog=`<path d="M15 21h20M12 26h26M16 31h18" stroke="${PALE}" stroke-width="2.6" stroke-linecap="round"/>`;
function icon(code,night){
  let a;
  const small=night?moonArt(30,16,5):sunArt(19.5,19,4.6);
  if(code===0) a=night?moonArt(26,19,8):sunArt(25,25,6.5);
  else if(code===1||code===2) a=small+cloudArt(15,12,1.05,CLOUD);
  else if(code===3) a=cloudArt(10,11,.9,PALE)+cloudArt(15,14,1.05,CLOUD);
  else if(code===45||code===48) a=fog;
  else if(code>=95) a=cloudArt(13,9,1.15,CLOUD)+bolt;
  else if((code>=71&&code<=77)||code===85||code===86) a=cloudArt(13,9,1.15,CLOUD)+snow;
  else if(code>=51) a=cloudArt(13,9,1.15,CLOUD)+rain;
  else a=cloudArt(13,12,1.15,CLOUD);
  return `<svg class="icon" viewBox="0 0 50 50" aria-hidden="true"><defs><filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#000" flood-opacity=".16"/></filter></defs><g filter="url(#sh)">${a}</g></svg>`;
}
const DESC={0:"clear sky",1:"few clouds",2:"scattered clouds",3:"overcast clouds",45:"fog",48:"fog",
 51:"light intensity drizzle",53:"drizzle",55:"heavy intensity drizzle",56:"freezing drizzle",57:"freezing drizzle",
 61:"light rain",63:"moderate rain",65:"heavy intensity rain",66:"freezing rain",67:"freezing rain",
 71:"light snow",73:"snow",75:"heavy snow",77:"snow",80:"light intensity shower rain",81:"shower rain",82:"heavy intensity shower rain",
 85:"light shower snow",86:"heavy shower snow",95:"thunderstorm",96:"thunderstorm with hail",99:"thunderstorm with hail"};

/* ---------- layout: same breakpoints as the Seguin widget ---------- */
const wx=document.getElementById("wx");
let wide=false;
function layout(){
  const w=Math.max(document.documentElement.clientWidth,window.innerWidth||0),
        h=Math.max(document.documentElement.clientHeight,window.innerHeight||0)-document.getElementById("recent").offsetHeight;
  const v=w<h||w<250, min=v?(h<=395||w<=260):(w<=365), stack=w<=670;
  wx.classList.toggle("v",v); wx.classList.toggle("min",min); wx.classList.toggle("stack",stack);
  const nowWide=!v&&!stack; if(nowWide!==wide){wide=nowWide; if(last) render(last)}}
window.addEventListener("resize",layout);

/* ---------- search ---------- */
const STATES={AL:"Alabama",AK:"Alaska",AZ:"Arizona",AR:"Arkansas",CA:"California",CO:"Colorado",CT:"Connecticut",DE:"Delaware",FL:"Florida",GA:"Georgia",HI:"Hawaii",ID:"Idaho",IL:"Illinois",IN:"Indiana",IA:"Iowa",KS:"Kansas",KY:"Kentucky",LA:"Louisiana",ME:"Maine",MD:"Maryland",MA:"Massachusetts",MI:"Michigan",MN:"Minnesota",MS:"Mississippi",MO:"Missouri",MT:"Montana",NE:"Nebraska",NV:"Nevada",NH:"New Hampshire",NJ:"New Jersey",NM:"New Mexico",NY:"New York",NC:"North Carolina",ND:"North Dakota",OH:"Ohio",OK:"Oklahoma",OR:"Oregon",PA:"Pennsylvania",RI:"Rhode Island",SC:"South Carolina",SD:"South Dakota",TN:"Tennessee",TX:"Texas",UT:"Utah",VT:"Vermont",VA:"Virginia",WA:"Washington",WV:"West Virginia",WI:"Wisconsin",WY:"Wyoming",DC:"District of Columbia"};
const slot=document.getElementById("nameSlot");
let place=null, last=null, matches=[], active=-1, timer=null, input=null, box=null;
function store(v){try{localStorage.setItem("tripWeatherPlace",JSON.stringify(v))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem("tripWeatherPlace"))}catch(e){return null}}

/* ---------- recent places: last 5 unique searches, newest first ---------- */
const same=(a,b)=>Math.abs(a.latitude-b.latitude)<0.01&&Math.abs(a.longitude-b.longitude)<0.01;
function loadRecent(){try{return JSON.parse(localStorage.getItem("tripWeatherRecent"))||[]}catch(e){return []}}
let recent=loadRecent();
function saveRecent(){try{localStorage.setItem("tripWeatherRecent",JSON.stringify(recent))}catch(e){}}
function addRecent(p){recent=[p,...recent.filter(r=>!same(r,p))].slice(0,5);saveRecent()}
function drawRecent(){
  const el=document.getElementById("recent");
  el.innerHTML=recent.length?`<span class="lbl">RECENT</span>`+recent.map((r,i)=>
    `<button class="chip${place&&same(r,place)?" on":""}" data-i="${i}" title="${esc(label(r))}">${esc(r.name)}</button>`).join(""):"";
  el.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const r=recent[+b.dataset.i]; if(place&&same(r,place))return;
    place=r; store(place); showName(); drawRecent(); forecast()});
  layout();
}
const label=p=>[p.name,p.admin1&&p.admin1!==p.name?p.admin1:null,p.country_code!=="US"?p.country:null].filter(Boolean).join(", ");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* build the search button and bar once */
document.body.insertAdjacentHTML("beforeend",`
  <button class="sbtn" id="sbtn" title="Search for a place" aria-label="Search for a place">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
  </button>
  <div class="sbar" id="sbar">
    <input id="q" type="text" placeholder="Search a city (e.g. Rockport, TX)" autocomplete="off" aria-label="Search location">
    <button class="x" id="sx" aria-label="Close search">×</button>
    <div class="results" id="results"></div>
  </div>`);
const sbar=document.getElementById("sbar"), sbtn=document.getElementById("sbtn");
input=document.getElementById("q"); box=document.getElementById("results");
sbtn.onclick=openSearch;
document.getElementById("sx").onclick=closeSearch;
input.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>search(false),300)});
input.addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"&&matches.length){active=(active+1)%matches.length;list();e.preventDefault()}
  else if(e.key==="ArrowUp"&&matches.length){active=(active-1+matches.length)%matches.length;list();e.preventDefault()}
  else if(e.key==="Enter"){e.preventDefault(); if(active>=0&&matches[active]) choose(matches[active]); else search(true)}
  else if(e.key==="Escape"&&place){closeSearch()}
});
input.addEventListener("blur",()=>setTimeout(()=>{if(place&&document.activeElement!==input&&!input.value.trim())closeSearch()},200));
box.addEventListener("mousedown",e=>{const b=e.target.closest("button"); if(b){e.preventDefault();choose(matches[+b.dataset.i])}});

function showName(){
  slot.innerHTML=`<b class="place" title="${esc(label(place))} — click to change">${esc(place.name.toUpperCase())}</b>`;
  slot.querySelector(".place").onclick=openSearch;
}
function openSearch(){ sbar.classList.add("open"); sbtn.style.display="none"; input.value=""; matches=[]; list(); input.focus() }
function closeSearch(){ if(!place) return; sbar.classList.remove("open"); sbtn.style.display=""; matches=[]; list(); input.blur() }
function list(){
  if(!matches.length){box.style.display="none";return}
  box.innerHTML=matches.map((p,i)=>`<button data-i="${i}" class="${i===active?"active":""}">${esc(label(p))}${p.population?` <small>· pop. ${p.population.toLocaleString()}</small>`:""}</button>`).join("");
  box.style.display="block";
}
async function geocode(text){
  const [first,...rest]=text.split(",").map(s=>s.trim()).filter(Boolean);
  if(!first) return [];
  const j=await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(first)}&count=20&language=en&format=json`)).json();
  let l=j.results||[];
  if(rest.length){
    const want=rest.join(" ").toLowerCase(), full=(STATES[rest[0].toUpperCase()]||"").toLowerCase();
    const f=l.filter(p=>{const a=(p.admin1||"").toLowerCase(),c=(p.country||"").toLowerCase(),cc=(p.country_code||"").toLowerCase();
      return (full&&a===full)||a.startsWith(want)||c.startsWith(want)||cc===want});
    if(f.length) l=f;
  }
  return l.slice(0,6);
}
async function search(pickFirst){
  const text=input.value.trim(); if(text.length<2){matches=[];list();return}
  try{ matches=await geocode(text); active=-1;
    if(pickFirst){ if(matches[0]) choose(matches[0]); else {matches=[];list();setMsg(`No place found for “${esc(text)}”.`)} }
    else list();
  }catch(e){ setMsg("Couldn't reach the location search.") }
}
function setMsg(m){document.getElementById("nowDesc").innerHTML=`<div class="msg">${m}</div>`}
function choose(p){
  matches=[]; place={name:p.name,admin1:p.admin1,country:p.country,country_code:p.country_code,latitude:p.latitude,longitude:p.longitude};
  store(place); addRecent(place); drawRecent(); showName(); closeSearch(); forecast();
}

/* ---------- forecast ---------- */
async function forecast(){
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${place.latitude}&longitude=${place.longitude}`+
    `&current=temperature_2m,weather_code,is_day&daily=weather_code,temperature_2m_max,temperature_2m_min`+
    `&temperature_unit=fahrenheit&timezone=auto&forecast_days=3`;
  try{ last=await (await fetch(url)).json(); render(last) }
  catch(e){ setMsg("Couldn't load the forecast.") }
}
function render(w){
  const c=w.current, d=w.daily;
  document.getElementById("nowIcon").innerHTML=icon(c.weather_code,c.is_day===0);
  document.getElementById("nowTemp").textContent=`${Math.round(c.temperature_2m)} ºF`;
  document.getElementById("nowDesc").textContent=DESC[c.weather_code]||"";
  document.getElementById("days").innerHTML=d.time.map((t,i)=>`
    <div class="day">
      <h4 class="t"><span class="name">${new Date(t+"T12:00").toLocaleDateString("en-US",{weekday:wide?"long":"short"})}</span></h4>
      <div class="iw">${icon(d.weather_code[i],false)}</div>
      <div class="deg"><div><h4 class="t hi">${Math.round(d.temperature_2m_max[i])} ºF</h4></div><div><h4 class="t">${Math.round(d.temperature_2m_min[i])} ºF</h4></div></div>
    </div>`).join("");
}

/* ---------- start: link ?q=, else last place searched, else ask ---------- */
layout();
const param=new URLSearchParams(location.search).get("q"), saved=load();
if(param){openSearch();input.value=param;search(true)}
else{
  /* nothing saved in this browser yet (or storage blocked): start on Seguin instead of a blank widget */
  place=saved||{name:"Seguin",admin1:"Texas",country:"United States",country_code:"US",latitude:29.56884,longitude:-97.96473};
  if(!recent.length) addRecent(place);
  drawRecent(); showName(); forecast();
}
</script>
</body>
</html>
